<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06110d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Minhas Finanças"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Minhas Finanças</title><style>*{box-sizing:border-box}body{margin:0;background:#050907;color:#f5faf7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:680px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px 105px;background:linear-gradient(180deg,#07120f,#050907)}.splash,.lock{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 38%,#0d3d29,#050907 58%);display:flex;align-items:center;justify-content:center;text-align:center}.splash{transition:.35s}.splash.hide{opacity:0;pointer-events:none}.logo{width:112px;height:112px;border-radius:30px}.muted{color:#81908a;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 14px}.top h1{font-size:23px;margin:0}.avatar{width:42px;height:42px;border-radius:50%;background:#123324;display:grid;place-items:center;color:#40ee91;font-weight:800}.hero{padding:22px;border-radius:27px;background:linear-gradient(135deg,#123b2a,#0a1712 75%);border:1px solid #1c6546}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1px;color:#86a097}.balance{font-size:42px;font-weight:800;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.card{background:#0d1512;border:1px solid #1c2823;border-radius:20px;padding:14px}.green{color:#32e88a}.red{color:#ff6f73}.blue{color:#62a9ff}.section{margin-top:20px}.progress{height:8px;background:#17211d;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#35e88b}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action,.btn{border-radius:16px;padding:14px;background:#111b17;color:#fff;border:1px solid #22332b;font-weight:800}.btn{background:#32e88a;color:#03110a;width:100%}.action span{display:block;font-size:11px;margin-top:7px}.row{display:flex;justify-content:space-between;align-items:center}.tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:10px;width:min(650px,calc(100% - 22px));background:#0b120fef;border:1px solid #26342e;border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr)}.tab{background:none;border:0;color:#718079;padding:7px;font-size:11px}.tab.active{color:#35e88b;font-weight:800}.tab div{font-size:18px}.lock{display:none;z-index:80;padding:30px}.lock.show{display:flex}.lockbox{max-width:360px}.face{width:76px;height:76px;border-radius:24px;background:#10251b;display:grid;place-items:center;margin:auto auto 20px;font-size:36px}.modal{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:680px;margin:auto;background:#0c1511;border-radius:28px 28px 0 0;padding:20px}.field{width:100%;background:#111c17;border:1px solid #26362f;color:#fff;border-radius:15px;padding:14px;margin:7px 0}</style></head><body><div id="splash" class="splash"><div><img class="logo" src="icon.svg"><h1>Minhas Finanças</h1><div class="muted">Seu dinheiro. Seus planos. Seu futuro.</div><div class="muted" style="margin-top:12px">Desenvolvido por Gabriel Ramos</div></div></div><div id="lock" class="lock"><div class="lockbox"><div class="face">◉</div><h1>Minhas Finanças</h1><p class="muted">Desbloqueie para acessar suas finanças</p><button class="btn" onclick="unlock()">Desbloquear</button></div></div><main class="app"><header class="top"><div><h1>Olá, Gabriel 👋</h1><div class="muted">Seu dinheiro. Seus planos. Seu futuro.</div></div><div class="avatar">GR</div></header><section id="home"></section><section id="mov" style="display:none"></section><section id="plans" style="display:none"></section><section id="reports" style="display:none"></section></main><nav class="tabs"><button class="tab active" onclick="tab('home',this)"><div>⌂</div>Início</button><button class="tab" onclick="tab('mov',this)"><div>☷</div>Movimentos</button><button class="tab" onclick="tab('plans',this)"><div>◎</div>Planos</button><button class="tab" onclick="tab('reports',this)"><div>▥</div>Relatórios</button></nav><div id="modal" class="modal"><div class="sheet"><h2>Nova movimentação</h2><select id="type" class="field"><option value="income">Entrada</option><option value="expense">Saída</option><option value="reserved">Reserva</option></select><input id="amount" class="field" inputmode="decimal" placeholder="Valor (R$)"><input id="note" class="field" placeholder="Descrição"><button class="btn" onclick="add()">Salvar</button></div></div><script>let d=JSON.parse(localStorage.mf||'null')||{m:[{t:'income',v:5200,n:'Salário'},{t:'expense',v:320,n:'Mercado'},{t:'expense',v:150,n:'Combustível'}],p:[{n:'Minha próxima moto',s:8500,g:30000},{n:'Viagem',s:2100,g:6000}]};const R=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);function save(){localStorage.mf=JSON.stringify(d)}function totals(){let i=0,e=0,r=0;d.m.forEach(x=>x.t==='income'?i+=x.v:x.t==='expense'?e+=x.v:r+=x.v);return{i,e,r,b:i-e-r}}function render(){let t=totals(),p=t.i?t.e/t.i:0;home.innerHTML=`<div class=hero><div class=eyebrow>DISPONÍVEL HOJE</div><div class=balance>${R(Math.max(t.b,0))}</div><div class=muted>Entradas − gastos − reservas</div></div><div class=stats><div class=card><span class=green>↙</span><h3>${R(t.i)}</h3><small class=muted>Entrou</small></div><div class=card><span class=red>↗</span><h3>${R(t.e)}</h3><small class=muted>Saiu</small></div><div class=card><span class=blue>▣</span><h3>${R(t.r)}</h3><small class=muted>Reservado</small></div></div><div class="section card"><div class=row><b>RITMO DO MÊS</b><b>${Math.round(p*100)}%</b></div><div class=progress style="margin:12px 0"><i style="width:${p*100}%"></i></div></div><div class="section card"><div class=eyebrow>POSSO GASTAR?</div><h2 class=green>${R(Math.max(t.b,0))}</h2></div><div class=section><div class=eyebrow>AÇÃO RÁPIDA</div><div class=actions><button class=action onclick=openM('income')>＋<span>Recebi</span></button><button class=action onclick=openM('expense')>−<span>Gastei</span></button><button class=action onclick=openM('reserved')>▣<span>Reservei</span></button></div></div><div class=section><div class=eyebrow>PLANOS</div>${d.p.map(x=>{let q=Math.min(x.s/x.g,1);return`<div class=card style="margin-top:10px"><div class=row><b>◎ ${x.n}</b><b>${Math.round(q*100)}%</b></div><div class=progress style="margin:10px 0"><i style="width:${q*100}%"></i></div><div class=row><small>${R(x.s)}</small><small>${R(x.g)}</small></div></div>`}).join('')}</div>`;mov.innerHTML=`<div class=eyebrow>HISTÓRICO</div><button class=btn onclick=openM('expense')>＋ Nova movimentação</button><div class=card style="margin-top:12px">${d.m.map((x,i)=>`<div class=row style="padding:13px 0;border-bottom:1px solid #17201c"><span>${x.n}</span><b class=${x.t==='income'?'green':x.t==='expense'?'red':'blue'}>${x.t==='income'?'+':'-'}${R(x.v)}</b><button onclick="d.m.splice(${i},1);save();render()" style="background:none;border:0;color:#777">×</button></div>`).join('')}</div>`;plans.innerHTML='<div class=eyebrow>MEUS PLANOS</div><div style="margin-top:12px">'+d.p.map(x=>`<div class=card style="margin-bottom:10px"><b>◎ ${x.n}</b><div class=progress style="margin:10px 0"><i style="width:${Math.min(x.s/x.g,1)*100}%"></i></div><div class=row>${R(x.s)}<span>${R(x.g)}</span></div></div>`).join('')+'</div>';reports.innerHTML=`<div class=eyebrow>RELATÓRIO</div><div class=stats><div class=card><small class=muted>Entradas</small><h3 class=green>${R(t.i)}</h3></div><div class=card><small class=muted>Saídas</small><h3 class=red>${R(t.e)}</h3></div></div>`}function tab(id,b){['home','mov','plans','reports'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function openM(t){modal.classList.add('open');type.value=t}function add(){let v=parseFloat(amount.value.replace(',','.'));if(!v)return;d.m.unshift({t:type.value,v,n:note.value||'Movimentação'});save();modal.classList.remove('open');amount.value='';note.value='';render()}function unlock(){localStorage.mfu='1';lock.classList.remove('show')}setTimeout(()=>splash.classList.add('hide'),2200);if(localStorage.mfu!=='1')setTimeout(()=>lock.classList.add('show'),2250);render()</script></body></html>'''
